<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUXORA — Smart Shopping</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#eee;font-family:Arial,sans-serif}
header{padding:20px 6%;border-bottom:1px solid #2d2617;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#080808ee;z-index:3}
.logo{color:#d4af37;font-weight:800;letter-spacing:5px;font-size:27px}.admin{color:#d4af37;border:1px solid #5b4a1d;padding:9px 13px;border-radius:8px}
.hero{text-align:center;padding:55px 20px 30px}.hero h1{font-size:42px;margin:0 0 12px}.gold{color:#d4af37}.hero p{color:#aaa;line-height:1.7}
.wrap{max-width:1100px;margin:auto;padding:20px}.title{border-left:3px solid #d4af37;padding-left:12px;margin:25px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:26px}.card{background:linear-gradient(180deg,#141414,#0d0d0d);border:1px solid #3a301b;border-radius:18px;overflow:hidden;box-shadow:0 12px 35px #0008;transition:.25s}.card:hover{transform:translateY(-4px);border-color:#d4af37}.pic{width:100%;height:300px;object-fit:contain;background:#fff;padding:22px}.info{padding:21px}.badge{display:inline-block;color:#d4af37;font-size:11px;font-weight:700;letter-spacing:1px;border:1px solid #6a551e;border-radius:20px;padding:6px 10px}.info h2{font-size:20px;line-height:1.45;margin:14px 0 8px}.price{font-size:25px;font-weight:900;color:#d4af37;margin:7px 0 10px}.desc{color:#aaa;line-height:1.65;font-size:14px}.btn{display:block;text-align:center;background:linear-gradient(135deg,#f0cf61,#c79e27);color:#080808;padding:14px;border-radius:9px;font-weight:900;margin-top:18px;letter-spacing:.5px;box-shadow:0 5px 18px #d4af3733}
footer{text-align:center;color:#777;padding:35px;border-top:1px solid #211e18;margin-top:60px}
@media(max-width:600px){.hero h1{font-size:31px}.logo{font-size:22px}}
</style><!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "0923e62aec0b4472a08d8e616b86b45f"}'></script><!-- End Cloudflare Web Analytics -->
</head><body>
<header><div class="logo">LUXORA</div><a class="admin" href="admin.html">ADMIN</a></header>
<section class="hero"><h1>Discover <span class="gold">Smart</span> Products</h1><p>Luxury finds and smart choices, selected for modern living.</p></section>
<main class="wrap">
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0">
<input id="search" placeholder="Search products..." style="flex:1;min-width:220px;padding:13px 15px;background:#111;color:#fff;border:1px solid #3a301b;border-radius:9px;outline:none">
<span style="color:#d4af37;border:1px solid #5b4a1d;padding:11px 13px;border-radius:9px">Smart Home</span>
<span style="color:#d4af37;border:1px solid #5b4a1d;padding:11px 13px;border-radius:9px">Best Deals</span>
</div>
<h2 class="title">Featured Products</h2><div id="products" class="grid"></div></main>
<footer>© 2026 LUXORA · Affiliate store</footer>
<script>
const fallback=[{name:"BSEED Zigbee Smart Touch Switch",price:"Add price",desc:"1/2/3 Gang 1 Way smart wall switch with Tuya, Smart Life, Google and Alexa support.",image:"https://ae01.alicdn.com/kf/Sf401287a71204383bfb5b004a9230501T.jpg",link:"https://s.click.aliexpress.com/e/_c2QfqVOL"}];
function trackProductClick(name){try{let c=JSON.parse(localStorage.getItem("luxora_clicks")||"[]");c.push({product:name,time:new Date().toISOString()});localStorage.setItem("luxora_clicks",JSON.stringify(c))}catch(e){}}
const data=JSON.parse(localStorage.getItem("luxora_products")||"null")||fallback;
function render(q=""){const x=data.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())||(p.desc||"").toLowerCase().includes(q.toLowerCase()));document.getElementById("products").innerHTML=x.map(p=>`<article class="card"><img class="pic" src="${p.image}" alt="${p.name}"><div class="info"><span class="badge">FEATURED</span><h2>${p.name}</h2><div class="price">${p.price||"Add price"}</div><p class="desc">${p.desc||""}</p><a class="btn" href="${p.link}" target="_blank" rel="nofollow sponsored noopener" onclick="trackProductClick(\'${p.name.replace(/\'/g, "\\\'")}\')">SHOP NOW →</a></div></article>`).join("")||'<p style="color:#aaa">No products found.</p>'}render();document.getElementById("search").addEventListener("input",e=>render(e.target.value));
</script>
<!-- LUXORA EVENT TRACKING -->
<script>
(function(){
  try {
    const s = JSON.parse(localStorage.getItem('luxora_stats') || '{}');
    s.productViews = s.productViews || 0;
    s.productClicks = s.productClicks || 0;
    s.buyClicks = s.buyClicks || 0;
    // A store visit is counted once per browser session.
    if (!sessionStorage.getItem('luxora_visit')) {
      s.visitors = (s.visitors || 0) + 1;
      sessionStorage.setItem('luxora_visit','1');
    }
    localStorage.setItem('luxora_stats', JSON.stringify(s));
    document.addEventListener('click', function(e){
      const a=e.target.closest('a');
      if(!a) return;
      const href=(a.getAttribute('href')||'').toLowerCase();
      const txt=(a.textContent||'').toLowerCase();
      if(href.includes('aliexpress') || txt.includes('shop now') || txt.includes('buy')) {
        const x=JSON.parse(localStorage.getItem('luxora_stats')||'{}');
        x.buyClicks=(x.buyClicks||0)+1;
        localStorage.setItem('luxora_stats',JSON.stringify(x));
      }
    });
  } catch(e){}
})();
</script>
<!-- /LUXORA EVENT TRACKING -->

</body></html>
