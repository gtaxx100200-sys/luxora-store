<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUXORA Store</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:Arial,sans-serif}
header{padding:24px 18px;text-align:center;border-bottom:1px solid #292929}
.logo{font-size:30px;font-weight:900;letter-spacing:6px;color:#d4af37}.sub{color:#999;margin-top:8px}
.wrap{max-width:1100px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#111;border:1px solid #282828;border-radius:18px;overflow:hidden}.pic{width:100%;aspect-ratio:1/1;object-fit:cover;background:#181818}.body{padding:15px}.name{font-size:18px;font-weight:700}.price{color:#d4af37;font-size:20px;font-weight:800;margin:10px 0}.desc{color:#aaa;line-height:1.6;min-height:48px}
.buy{display:block;text-align:center;text-decoration:none;background:#d4af37;color:#090909;font-weight:800;padding:12px;border-radius:10px;margin-top:12px}
.empty{text-align:center;color:#888;padding:60px 10px}.admin{display:block;text-align:center;margin:28px;color:#666;text-decoration:none;font-size:12px}
</style>
</head>
<body>
<header><div class="logo">LUXORA</div><div class="sub">Premium products, simple shopping.</div></header>
<main class="wrap"><div id="products" class="grid"></div></main>
<a class="admin" href="admin.html">Administration</a>
<script>
const FALLBACK=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
async function load(){
 let products=FALLBACK;
 try{const r=await fetch('products.json?v='+Date.now(),{cache:'no-store'});if(r.ok){const x=await r.json();if(Array.isArray(x))products=x;}}catch(e){}
 const box=document.getElementById('products');
 if(!products.length){box.innerHTML='<div class="empty">لا توجد منتجات حاليًا.</div>';return;}
 box.innerHTML=products.map((p,i)=>`
 <article class="card">
 <img class="pic" src="${esc(p.image||'')}" alt="${esc(p.name)}" onerror="this.style.visibility='hidden'">
 <div class="body"><div class="name">${esc(p.name)}</div>
 <div class="price">${esc(p.price)}</div><div class="desc">${esc(p.desc)}</div>
 ${p.link&&p.link!=='#'?`<a class="buy" href="${esc(p.link)}" target="_blank" rel="noopener">شراء المنتج</a>`:''}
 </div></article>`).join('');
}
load();
</script>
</body></html>
